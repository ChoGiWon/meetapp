<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>MeetApp Map</title>
    <script>
        var urlParams = new URLSearchParams(window.location.search);
        var tmapKey = (urlParams.get("tmap") || "").trim();
        var kakaoKey = (urlParams.get("kakao") || "").trim();
        var naverKey = (urlParams.get("naver") || "").trim();

        // <head> 파싱 시점에 동기 로드하여 TMAP/Kakao/Naver 내부 로더 충돌 방지
        if (tmapKey && tmapKey.indexOf("붙여넣기") === -1) {
            document.write('<script src="https://apis.openapi.sk.com/tmap/vectorjs?version=1&appKey=' + encodeURIComponent(tmapKey) + '"><\/script>');
        }
        if (kakaoKey && kakaoKey.indexOf("붙여넣기") === -1) {
            document.write('<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(kakaoKey) + '&autoload=false"><\/script>');
        }
        if (naverKey && naverKey.indexOf("붙여넣기") === -1) {
            document.write('<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(naverKey) + '"><\/script>');
        }
    </script>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #FAFAFA; font-family: sans-serif;
            position: relative;
            touch-action: none;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .provider-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }
        .provider-panel.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }
        .map-canvas {
            width: 100%; height: 100%;
        }
        .status-box {
            width: 100%; height: 100%; padding: 24px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: #333333; background: #FAFAFA;
        }
        .badge {
            background: #E8F5E9; color: #13A84F; padding: 6px 12px;
            border-radius: 16px; font-weight: bold; font-size: 13px; margin-bottom: 12px;
        }
        .badge.warn {
            background: #FFF3E0; color: #E65100;
        }
        .status-box h3 { margin: 0 0 8px 0; font-size: 18px; }
        .status-box p { margin: 0; font-size: 13px; color: #666666; line-height: 1.6; }
        code { background: #EEEEEE; padding: 2px 6px; border-radius: 4px; color: #D32F2F; }
        .zoom-controls {
            position: fixed; right: 14px; bottom: 20px; z-index: 9999;
            display: flex; flex-direction: column; gap: 8px;
        }
        .zoom-btn {
            width: 42px; height: 42px; border-radius: 10px;
            background: #FFFFFF; border: 1px solid #D0D7DE;
            box-shadow: 0 2px 6px rgba(0,0,0,0.22);
            font-size: 24px; font-weight: bold; color: #111111;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
        }
        .zoom-btn:active { background: #E9ECEF; }
        .place-banner {
            position: fixed; left: 14px; top: 12px; z-index: 9998;
            background: rgba(255, 255, 255, 0.95); border: 1px solid #DCDFE4;
            border-radius: 8px; padding: 6px 12px; font-size: 12px;
            font-weight: bold; color: #111111; box-shadow: 0 2px 5px rgba(0,0,0,0.12);
            display: none; max-width: 78%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .my-loc-dot {
            width: 18px; height: 18px; border-radius: 50%;
            background: #0064FF; border: 3px solid #FFFFFF;
            box-shadow: 0 0 0 4px rgba(0, 100, 255, 0.28), 0 2px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div id="place_banner" class="place-banner"></div>

    <!-- 티맵 패널 -->
    <div id="panel_tmap" class="provider-panel active">
        <div id="tmap_div" class="map-canvas"></div>
    </div>

    <!-- 카카오맵 패널 -->
    <div id="panel_kakao" class="provider-panel">
        <div id="kakao_div" class="map-canvas"></div>
    </div>

    <!-- 네이버맵 패널 -->
    <div id="panel_naver" class="provider-panel">
        <div id="naver_div" class="map-canvas"></div>
    </div>

    <!-- 공통 확대/축소 버튼 -->
    <div id="zoom_box" class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()">+</button>
        <button class="zoom-btn" onclick="zoomOut()">−</button>
    </div>

    <script>
        var activeProvider = "tmap";
        var currentLat = 37.5665;
        var currentLon = 126.9780;
        var currentTitle = "";
        var hasSearched = false;

        var myLat = null;
        var myLon = null;

        var tmapObj = null;
        var tmapMarker = null;
        var tmapInfoWindow = null;
        var tmapMyLocMarker = null;

        var kakaoSdkReady = false;
        var kakaoObj = null;
        var kakaoMarker = null;
        var kakaoInfoWindow = null;
        var kakaoMyLocOverlay = null;

        var naverSdkReady = false;
        var naverObj = null;
        var naverMarker = null;
        var naverInfoWindow = null;
        var naverMyLocMarker = null;

        function sendToApp(payload) {
            try {
                console.log("MEETAPP_EVENT:" + JSON.stringify(payload));
            } catch (e) {}
        }

        function escapeHtml(text) {
            if (!text) return "";
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function showStatusMessage(containerId, badgeText, title, descHtml, isWarn) {
            var el = document.getElementById(containerId);
            if (!el) return;
            el.innerHTML =
                '<div class="status-box">' +
                '<div class="badge ' + (isWarn ? 'warn' : '') + '">' + badgeText + '</div>' +
                '<h3>' + title + '</h3>' +
                '<p>' + descHtml + '</p>' +
                '</div>';
        }

        function buildMarkerLabelHtml(title) {
            return (
                '<div style="background:#222222; color:#FFFFFF; padding:5px 10px; ' +
                'border-radius:6px; font-size:12px; font-weight:bold; white-space:nowrap; ' +
                'box-shadow:0 2px 6px rgba(0,0,0,0.28);">' +
                escapeHtml(title) +
                '</div>'
            );
        }

        function updateZoomVisibility() {
            var zoomBox = document.getElementById("zoom_box");
            if (!zoomBox) return;
            var hasMap = (activeProvider === "tmap" && tmapObj) ||
                         (activeProvider === "kakao" && kakaoObj) ||
                         (activeProvider === "naver" && naverObj);
            zoomBox.style.display = hasMap ? "flex" : "none";
        }

        window.navermap_authFailure = function () {
            naverObj = null;
            showStatusMessage(
                "naver_div",
                "네이버 지도 인증 오류",
                "네이버맵 URL / Client ID 확인 필요",
                "네이버 클라우드 플랫폼 콘솔의 <code>Web 서비스 URL</code>에<br><code>https://chogiwon.github.io</code>가 등록되었는지 확인해 주세요.",
                true
            );
            updateZoomVisibility();
        };

        // =============================================================
        // [1] 지도 위 특정 지점 터치(클릭) 공통 처리
        // =============================================================
        function handleMapPointClick(lat, lon) {
            if (typeof lat !== "number" || typeof lon !== "number" || isNaN(lat) || isNaN(lon)) {
                return;
            }
            currentLat = lat;
            currentLon = lon;
            currentTitle = "선택한 위치 (주소 조회 중...)";
            hasSearched = true;

            var banner = document.getElementById("place_banner");
            if (banner) {
                banner.innerText = "📍 주소 조회 중...";
                banner.style.display = "block";
            }

            if (activeProvider === "tmap") {
                applyTmapMarker(lat, lon, currentTitle, false);
            }
            applyKakaoMarker(lat, lon, currentTitle, false);
            applyNaverMarker(lat, lon, currentTitle, false);

            sendToApp({
                type: "map_click",
                lat: lat,
                lon: lon
            });
        }

        function extractTmapClickCoords(evt) {
            if (!evt) return null;
            var lat = null;
            var lon = null;
            if (evt.latLng) {
                lat = typeof evt.latLng.lat === "function" ? evt.latLng.lat() : (evt.latLng._lat || evt.latLng.lat);
                lon = typeof evt.latLng.lng === "function" ? evt.latLng.lng() : (evt.latLng._lng || evt.latLng.lng);
            } else if (evt.lngLat) {
                lat = evt.lngLat.lat;
                lon = evt.lngLat.lng;
            } else if (evt.data && evt.data.lngLat) {
                lat = evt.data.lngLat.lat;
                lon = evt.data.lngLat.lng;
            }
            if (lat !== null && lon !== null) {
                return { lat: Number(lat), lon: Number(lon) };
            }
            return null;
        }

        // =============================================================
        // [2] 현위치 마커 표시 및 브라우저 Geolocation 요청
        // =============================================================
        function renderMyLocationMarkers() {
            if (myLat === null || myLon === null) return;

            if (tmapObj && typeof Tmapv3 !== "undefined") {
                if (tmapMyLocMarker) {
                    try { tmapMyLocMarker.setMap(null); } catch (e) {}
                    tmapMyLocMarker = null;
                }
                try {
                    tmapMyLocMarker = new Tmapv3.Marker({
                        position: new Tmapv3.LatLng(myLat, myLon),
                        map: tmapObj,
                        iconHTML: '<div class="my-loc-dot" title="현위치"></div>'
                    });
                } catch (e) {}
            }

            if (kakaoObj && typeof kakao !== "undefined") {
                if (kakaoMyLocOverlay) {
                    kakaoMyLocOverlay.setMap(null);
                    kakaoMyLocOverlay = null;
                }
                kakaoMyLocOverlay = new kakao.maps.CustomOverlay({
                    position: new kakao.maps.LatLng(myLat, myLon),
                    content: '<div class="my-loc-dot" title="현위치"></div>',
                    yAnchor: 0.5,
                    xAnchor: 0.5
                });
                kakaoMyLocOverlay.setMap(kakaoObj);
            }

            if (naverObj && typeof naver !== "undefined") {
                if (naverMyLocMarker) {
                    naverMyLocMarker.setMap(null);
                    naverMyLocMarker = null;
                }
                naverMyLocMarker = new naver.maps.Marker({
                    position: new naver.maps.LatLng(myLat, myLon),
                    map: naverObj,
                    icon: {
                        content: '<div class="my-loc-dot" title="현위치"></div>',
                        anchor: new naver.maps.Point(12, 12)
                    }
                });
            }
        }

        function setMyLocation(lat, lon, moveCenter) {
            myLat = Number(lat);
            myLon = Number(lon);
            renderMyLocationMarkers();
            if (moveCenter) {
                currentLat = myLat;
                currentLon = myLon;
                if (tmapObj && typeof Tmapv3 !== "undefined") {
                    tmapObj.setCenter(new Tmapv3.LatLng(myLat, myLon));
                    tmapObj.setZoom(16);
                }
                if (kakaoObj && typeof kakao !== "undefined") {
                    kakaoObj.setCenter(new kakao.maps.LatLng(myLat, myLon));
                }
                if (naverObj && typeof naver !== "undefined") {
                    naverObj.setCenter(new naver.maps.LatLng(myLat, myLon));
                }
            }
        }

        function clearMyLocation() {
            myLat = null;
            myLon = null;
            if (tmapMyLocMarker) {
                try { tmapMyLocMarker.setMap(null); } catch (e) {}
                tmapMyLocMarker = null;
            }
            if (kakaoMyLocOverlay) {
                kakaoMyLocOverlay.setMap(null);
                kakaoMyLocOverlay = null;
            }
            if (naverMyLocMarker) {
                naverMyLocMarker.setMap(null);
                naverMyLocMarker = null;
            }
        }

        function requestCurrentLocation() {
            if (!navigator.geolocation) {
                sendToApp({ type: "geo_error", message: "Geolocation not supported" });
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    var lat = pos.coords.latitude;
                    var lon = pos.coords.longitude;
                    setMyLocation(lat, lon, true);
                    sendToApp({
                        type: "geo_result",
                        lat: lat,
                        lon: lon,
                        source: "gps"
                    });
                },
                function (err) {
                    sendToApp({
                        type: "geo_error",
                        code: err ? err.code : -1,
                        message: err ? err.message : "GPS unavailable"
                    });
                },
                {
                    enableHighAccuracy: true,
                    timeout: 4500,
                    maximumAge: 10000
                }
            );
        }

        // =============================================================
        // [3] 티맵 WebGL 캔버스 초기화 / 탭 복귀 시 재생성 함수
        // =============================================================
        function rebuildTmap() {
            if (!tmapKey || tmapKey.indexOf("붙여넣기") !== -1) {
                showStatusMessage("tmap_div", "API 키 연동 대기 중", "티맵 (TMAP)", "<code>config.py</code>의 <code>TMAP_APP_KEY</code>를 확인해 주세요.", false);
                updateZoomVisibility();
                return;
            }
            if (typeof Tmapv3 === "undefined" || !Tmapv3.Map) {
                showStatusMessage(
                    "tmap_div",
                    "티맵 인증 / 도메인 확인",
                    "티맵 SDK를 불러오지 못했습니다",
                    "SK Open API 콘솔에서 <code>TMAP_APP_KEY</code> 상태를 확인해 주세요.",
                    true
                );
                updateZoomVisibility();
                return;
            }

            var tDiv = document.getElementById("tmap_div");
            if (!tDiv) return;

            if (tmapObj) {
                try {
                    if (typeof tmapObj.destroy === "function") {
                        tmapObj.destroy();
                    }
                } catch (e) {}
                tmapObj = null;
                tmapMarker = null;
                tmapInfoWindow = null;
                tmapMyLocMarker = null;
            }

            tDiv.innerHTML = "";

            try {
                tmapObj = new Tmapv3.Map("tmap_div", {
                    center: new Tmapv3.LatLng(currentLat, currentLon),
                    width: "100%",
                    height: "100%",
                    zoom: 16
                });

                tmapObj.addListener("click", function (evt) {
                    var coords = extractTmapClickCoords(evt);
                    if (coords) {
                        handleMapPointClick(coords.lat, coords.lon);
                    }
                });

                renderMyLocationMarkers();
                if (hasSearched) {
                    applyTmapMarker(currentLat, currentLon, currentTitle, true);
                }
            } catch (e) {
                showStatusMessage("tmap_div", "티맵 초기화 오류", "티맵 렌더링 실패", String(e), true);
            }
            updateZoomVisibility();
        }

        // =============================================================
        // [4] 페이지 로드 시 3사 SDK 상태 확인 및 초기화
        // =============================================================
        function initAllMaps() {
            rebuildTmap();

            if (!kakaoKey || kakaoKey.indexOf("붙여넣기") !== -1) {
                showStatusMessage("kakao_div", "API 키 연동 대기 중", "카카오맵 (Kakao Map)", "<code>config.py</code>의 <code>KAKAO_JS_KEY</code>를 입력해 주세요.", false);
            } else if (typeof kakao !== "undefined" && kakao.maps) {
                kakaoSdkReady = true;
                if (activeProvider === "kakao") {
                    ensureKakaoMap();
                }
            } else {
                showStatusMessage(
                    "kakao_div",
                    "카카오맵 인증 오류",
                    "카카오맵 도메인 / 키 / 활성화 확인",
                    "카카오 디벨로퍼스에서 <code>카카오맵 ON</code> 및 <code>https://chogiwon.github.io</code> 등록을 확인해 주세요.",
                    true
                );
            }

            if (!naverKey || naverKey.indexOf("붙여넣기") !== -1) {
                showStatusMessage("naver_div", "API 키 연동 대기 중", "네이버 지도 (Naver Map)", "<code>config.py</code>의 <code>NAVER_CLIENT_ID</code>를 입력해 주세요.", false);
            } else if (typeof naver !== "undefined" && naver.maps) {
                naverSdkReady = true;
                if (activeProvider === "naver") {
                    ensureNaverMap();
                }
            } else {
                showStatusMessage(
                    "naver_div",
                    "로드 실패",
                    "네이버 지도 SDK 로드 오류",
                    "네트워크 연결 및 <code>NAVER_CLIENT_ID</code>를 확인해 주세요.",
                    true
                );
            }

            updateZoomVisibility();
        }

        function ensureKakaoMap() {
            if (!kakaoSdkReady || typeof kakao === "undefined" || !kakao.maps) return;
            if (!kakaoObj) {
                kakao.maps.load(function () {
                    try {
                        var container = document.getElementById("kakao_div");
                        kakaoObj = new kakao.maps.Map(container, {
                            center: new kakao.maps.LatLng(currentLat, currentLon),
                            level: 3,
                            draggable: true,
                            zoomable: true
                        });
                        kakaoObj.setDraggable(true);
                        kakaoObj.setZoomable(true);

                        kakao.maps.event.addListener(kakaoObj, "click", function (mouseEvent) {
                            var latlng = mouseEvent.latLng;
                            handleMapPointClick(latlng.getLat(), latlng.getLng());
                        });

                        renderMyLocationMarkers();
                        if (hasSearched) {
                            applyKakaoMarker(currentLat, currentLon, currentTitle, true);
                        }
                        updateZoomVisibility();
                    } catch (e) {
                        console.error("Kakao init error:", e);
                    }
                });
            } else {
                kakaoObj.relayout();
                kakaoObj.setZoomable(true);
                kakaoObj.setCenter(new kakao.maps.LatLng(currentLat, currentLon));
                renderMyLocationMarkers();
                updateZoomVisibility();
            }
        }

        function ensureNaverMap() {
            if (!naverSdkReady || typeof naver === "undefined" || !naver.maps) return;
            if (!naverObj) {
                try {
                    naverObj = new naver.maps.Map("naver_div", {
                        center: new naver.maps.LatLng(currentLat, currentLon),
                        zoom: 16,
                        draggable: true,
                        pinchZoom: true,
                        scrollWheel: true,
                        disableDoubleTapZoom: false,
                        disableDoubleClickZoom: false
                    });

                    naver.maps.Event.addListener(naverObj, "click", function (e) {
                        if (e && e.coord) {
                            handleMapPointClick(e.coord.lat(), e.coord.lng());
                        }
                    });

                    renderMyLocationMarkers();
                    if (hasSearched) {
                        applyNaverMarker(currentLat, currentLon, currentTitle, true);
                    }
                    updateZoomVisibility();
                } catch (e) {
                    console.error("Naver init error:", e);
                }
            } else {
                window.dispatchEvent(new Event("resize"));
                naverObj.setCenter(new naver.maps.LatLng(currentLat, currentLon));
                renderMyLocationMarkers();
                updateZoomVisibility();
            }
        }

        // =============================================================
        // [5] 지도별 마커 및 말풍선 동기화 함수
        // =============================================================
        function applyTmapMarker(lat, lon, title, recenter) {
            if (!tmapObj || typeof Tmapv3 === "undefined") return;
            var tPos = new Tmapv3.LatLng(lat, lon);
            if (recenter !== false) {
                tmapObj.setCenter(tPos);
                tmapObj.setZoom(16);
            }

            if (tmapMarker) { tmapMarker.setMap(null); tmapMarker = null; }
            if (tmapInfoWindow) { tmapInfoWindow.setMap(null); tmapInfoWindow = null; }

            tmapMarker = new Tmapv3.Marker({
                position: tPos,
                map: tmapObj
            });

            if (title) {
                tmapInfoWindow = new Tmapv3.InfoWindow({
                    position: tPos,
                    content: buildMarkerLabelHtml(title),
                    border: "0px solid #000000",
                    background: "transparent",
                    type: 2,
                    map: tmapObj
                });
            }
        }

        function applyKakaoMarker(lat, lon, title, recenter) {
            if (!kakaoObj || typeof kakao === "undefined") return;
            var kPos = new kakao.maps.LatLng(lat, lon);
            if (recenter !== false) {
                kakaoObj.setCenter(kPos);
            }

            if (kakaoMarker) { kakaoMarker.setMap(null); kakaoMarker = null; }
            if (kakaoInfoWindow) { kakaoInfoWindow.close(); kakaoInfoWindow = null; }

            kakaoMarker = new kakao.maps.Marker({ position: kPos });
            kakaoMarker.setMap(kakaoObj);

            if (title) {
                kakaoInfoWindow = new kakao.maps.InfoWindow({
                    position: kPos,
                    content: '<div style="padding:5px 10px; font-size:12px; font-weight:bold; color:#111111; white-space:nowrap;">' + escapeHtml(title) + '</div>'
                });
                kakaoInfoWindow.open(kakaoObj, kakaoMarker);
            }
        }

        function applyNaverMarker(lat, lon, title, recenter) {
            if (!naverObj || typeof naver === "undefined") return;
            var nPos = new naver.maps.LatLng(lat, lon);
            if (recenter !== false) {
                naverObj.setCenter(nPos);
            }

            if (naverMarker) { naverMarker.setMap(null); naverMarker = null; }
            if (naverInfoWindow) { naverInfoWindow.close(); naverInfoWindow = null; }

            naverMarker = new naver.maps.Marker({
                position: nPos,
                map: naverObj
            });

            if (title) {
                naverInfoWindow = new naver.maps.InfoWindow({
                    content: '<div style="padding:5px 10px; font-size:12px; font-weight:bold; color:#111111; white-space:nowrap;">' + escapeHtml(title) + '</div>',
                    borderWidth: 1,
                    borderColor: "#CCCCCC",
                    backgroundColor: "#FFFFFF"
                });
                naverInfoWindow.open(naverObj, naverMarker);
            }
        }

        // =============================================================
        // [6] 파이썬(Flet)에서 호출하는 제어 함수
        // =============================================================
        function switchProvider(providerId) {
            activeProvider = providerId;
            var panels = ["tmap", "kakao", "naver"];
            for (var i = 0; i < panels.length; i++) {
                var el = document.getElementById("panel_" + panels[i]);
                if (el) {
                    if (panels[i] === providerId) {
                        el.classList.add("active");
                    } else {
                        el.classList.remove("active");
                    }
                }
            }

            if (providerId === "kakao") {
                ensureKakaoMap();
            } else if (providerId === "naver") {
                ensureNaverMap();
            } else if (providerId === "tmap") {
                requestAnimationFrame(function () {
                    rebuildTmap();
                });
            }
            updateZoomVisibility();
        }

        function moveToLocation(lat, lon, title) {
            currentLat = lat;
            currentLon = lon;
            currentTitle = title || "";
            hasSearched = true;

            var banner = document.getElementById("place_banner");
            if (banner && currentTitle) {
                banner.innerText = "📍 " + currentTitle;
                banner.style.display = "block";
            }

            if (activeProvider === "tmap") {
                applyTmapMarker(lat, lon, currentTitle, true);
            }
            applyKakaoMarker(lat, lon, currentTitle, true);
            applyNaverMarker(lat, lon, currentTitle, true);
        }

        function updateMarkerTitle(lat, lon, title) {
            currentLat = lat;
            currentLon = lon;
            currentTitle = title || "";
            hasSearched = true;

            var banner = document.getElementById("place_banner");
            if (banner && currentTitle) {
                banner.innerText = "📍 " + currentTitle;
                banner.style.display = "block";
            }

            if (activeProvider === "tmap") {
                applyTmapMarker(lat, lon, currentTitle, false);
            }
            applyKakaoMarker(lat, lon, currentTitle, false);
            applyNaverMarker(lat, lon, currentTitle, false);
        }

        function copyTextInBrowser(text) {
            if (!text) return;
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).catch(function () {});
                }
                var ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.left = "-9999px";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
            } catch (e) {}
        }

        function zoomIn() {
            if (activeProvider === "tmap" && tmapObj) {
                tmapObj.setZoom(tmapObj.getZoom() + 1);
            } else if (activeProvider === "kakao" && kakaoObj) {
                kakaoObj.setLevel(kakaoObj.getLevel() - 1);
            } else if (activeProvider === "naver" && naverObj) {
                naverObj.setZoom(naverObj.getZoom() + 1);
            }
        }

        function zoomOut() {
            if (activeProvider === "tmap" && tmapObj) {
                tmapObj.setZoom(tmapObj.getZoom() - 1);
            } else if (activeProvider === "kakao" && kakaoObj) {
                kakaoObj.setLevel(kakaoObj.getLevel() + 1);
            } else if (activeProvider === "naver" && naverObj) {
                naverObj.setZoom(naverObj.getZoom() - 1);
            }
        }

        window.onload = initAllMaps;
    </script>
</body>
</html>
